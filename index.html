<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13233e"><link rel="manifest" href="manifest.webmanifest"><title>Work Hours</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#13233e;color:white;padding:20px 16px}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#b9c9e5}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #1a35520b}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 14px;background:#e9eff9;color:#15243e;font-weight:700;cursor:pointer}button.primary{background:#2464e8;color:white}button.danger{background:#ffedf0;color:#ad1834}button.emergency{background:#bd3048;color:white}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#69768b;padding:8px 0}.day{min-height:70px;padding:8px 4px;background:#f5f7fb;border:2px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.day.selected{border-color:#2464e8;background:#e9f0ff}.day.muted{opacity:.28}.dots{display:flex;gap:4px}.dot{width:7px;height:7px;border-radius:50%;background:#2464e8}.dot.red{background:#bd3048}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f3f6fc;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:21px}.stat small{color:#66758b}.entry{border-top:1px solid #e8ecf4;padding:12px 0}.entry p{margin:4px 0;color:#66758b;font-size:14px}.tag{font-size:12px;padding:4px 7px;border-radius:7px;background:#e7efff;color:#2054bd;font-weight:700}.tag.red{background:#ffe9ed;color:#a52840}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cdd6e5;border-radius:9px;padding:11px;font:inherit}textarea{resize:vertical}dialog{border:0;border-radius:18px;padding:22px;width:min(440px,94vw);box-shadow:0 20px 80px #10213c60}dialog::backdrop{background:#0d193a88}h2{margin:0 0 14px;font-size:19px}.sub{color:#69768b;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 5px;border-bottom:1px solid #e6eaf1;text-align:left}td:last-child,th:last-child{text-align:right}.reportsection{margin:18px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}@media(max-width:430px){.day{min-height:60px}.wrap{padding:10px}.card{padding:13px}.stats{gap:5px}.stat{padding:9px 3px}.stat strong{font-size:17px}}@media print{header,.no-print,#calendarCard,#dailyCard,#historyCard{display:none!important}body{background:white}.wrap{max-width:none}.card{box-shadow:none}#reportCard{display:block!important}#reportDetails{display:block!important}button{display:none!important}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>WORK HOURS</h1><p>Overtime & Emergency Tracker</p></div></header><main class="wrap"><section class="card no-print"><div class="row"><label style="margin:0">Employee Name <input id="employee" placeholder="Enter your name" style="margin-top:5px"></label><button id="saveName">Save Name</button></div></section><section class="card" id="calendarCard"><div class="row"><button id="prevMonth" aria-label="Previous month">❮</button><h2 id="monthTitle" style="margin:0"></h2><button id="nextMonth" aria-label="Next month">❯</button></div><div id="calendar" class="grid"></div></section><section class="card" id="dailyCard"><div class="row"><h2 id="selectedTitle"></h2><button id="todayBtn">Today</button></div><div class="actions"><button class="primary" id="addOvertime">+ Add Overtime</button><button class="emergency" id="addEmergency">+ Add Emergency</button></div><div id="dailyEntries"></div></section><section class="card" id="reportCard"><div class="row"><h2 style="margin:0">Weekly Report</h2><div class="actions" style="margin:0"><button id="prevWeek">❮</button><button id="nextWeek">❯</button></div></div><p class="sub" id="weekRange"></p><div class="stats"><div class="stat"><strong id="otTotal">0</strong><small>Overtime hrs</small></div><div class="stat"><strong id="emTotal">0</strong><small>Emergency hrs</small></div><div class="stat"><strong id="allTotal">0</strong><small>Total hrs</small></div></div><div class="actions no-print"><button id="toggleReport" class="primary">View Full Report</button><button id="printReport">Save / Print PDF</button><button id="shareReport">Share Report</button><button id="markSent">Mark as Sent</button></div><p class="sub" id="reportStatus"></p><div id="reportDetails" class="hidden"></div></section><section class="card no-print" id="historyCard"><h2>History & Backup</h2><p class="sub">Select any date to review a past week. Export backups regularly; clearing browser data can delete locally stored entries.</p><div class="actions"><button id="exportBackup">Download Backup</button><button id="importBackup">Restore Backup</button><input id="backupFile" type="file" accept="application/json,.json" class="hidden"></div><p class="sub" id="recordCount"></p></section></main><dialog id="editor"><form id="entryForm"><h2 id="editorTitle">Add Entry</h2><input type="hidden" id="entryId"><label>Type<select id="type"><option value="overtime">Overtime</option><option value="emergency">Emergency</option></select></label><label>Date<input type="date" id="date" required></label><label>Apartment<input id="apartment" placeholder="e.g. 205" required maxlength="60"></label><label>Description<textarea id="description" rows="3" placeholder="Work performed" required maxlength="600"></textarea></label><label>Hours worked<input type="number" id="hours" min="0.01" max="24" step="0.01" required placeholder="e.g. 1.5"></label><div class="actions"><button type="button" id="cancelEditor">Cancel</button><button type="submit" class="primary">Save Entry</button></div></form></dialog><script>
'use strict';const KEY='workhours.v1',NAME='workhours.name',SENT='workhours.sent';const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const weekStart=d=>{let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const nice=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const hours=n=>Math.round((n+Number.EPSILON)*100)/100;const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let entries=[],sent={},selected=new Date(),shown=new Date(selected.getFullYear(),selected.getMonth(),1),reportWeek=weekStart(selected);function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(a)?a.filter(valid):[]}catch{entries=[]}try{sent=JSON.parse(localStorage.getItem(SENT)||'{}')||{}}catch{sent={}}$('employee').value=localStorage.getItem(NAME)||''}function valid(e){return e&&typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&['overtime','emergency'].includes(e.type)&&typeof e.apartment==='string'&&typeof e.description==='string'&&Number.isFinite(Number(e.hours))&&Number(e.hours)>0&&Number(e.hours)<=24}function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(SENT,JSON.stringify(sent));render()}catch{alert('Storage is unavailable or full. Download a backup and check browser settings.')}}function weekEntries(){let start=fmt(reportWeek),end=fmt(addDays(reportWeek,6));return entries.filter(e=>e.date>=start&&e.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||a.apartment.localeCompare(b.apartment))}function sum(a){return hours(a.reduce((n,e)=>n+Number(e.hours),0))}function renderCalendar(){let first=new Date(shown.getFullYear(),shown.getMonth(),1);$('monthTitle').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="weekday">${d}</div>`).join('');let offset=(first.getDay()+6)%7;let begin=addDays(first,-offset);for(let i=0;i<42;i++){let d=addDays(begin,i),s=fmt(d),types=entries.filter(e=>e.date===s).map(e=>e.type);html+=`<button class="day ${d.getMonth()!==shown.getMonth()?'muted':''} ${s===fmt(selected)?'selected':''}" data-day="${s}" aria-label="${nice(d)}"><span>${d.getDate()}</span><span class="dots">${types.includes('overtime')?'<i class="dot"></i>':''}${types.includes('emergency')?'<i class="dot red"></i>':''}</span></button>`}$('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=parse(b.dataset.day);shown=new Date(selected.getFullYear(),selected.getMonth(),1);reportWeek=weekStart(selected);render()})}function renderDaily(){$('selectedTitle').textContent=nice(selected);let day=entries.filter(e=>e.date===fmt(selected));$('dailyEntries').innerHTML=day.length?day.map(e=>`<div class="entry"><div class="row"><span class="tag ${e.type==='emergency'?'red':''}">${e.type==='emergency'?'Emergency':'Overtime'}</span><strong>${escapeHTML(e.apartment)} · ${hours(Number(e.hours))} hrs</strong></div><p>${escapeHTML(e.description)}</p><div class="actions"><button data-edit="${escapeHTML(e.id)}">Edit</button><button class="danger" data-delete="${escapeHTML(e.id)}">Delete</button></div></div>`).join(''):'<p class="sub">No entries for this day.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(entries.find(e=>e.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){entries=entries.filter(e=>e.id!==b.dataset.delete);save()}})}function reportMarkup(){let all=weekEntries(),name=$('employee').value.trim()||'Not specified';const section=(type,title)=>{let a=all.filter(e=>e.type===type);return `<div class="reportsection"><h3>${title}</h3><table><thead><tr><th>Date</th><th>Apartment</th><th>Description</th><th>Hours</th></tr></thead><tbody>${a.length?a.map(e=>`<tr><td>${escapeHTML(e.date)}</td><td>${escapeHTML(e.apartment)}</td><td>${escapeHTML(e.description)}</td><td>${hours(Number(e.hours))}</td></tr>`).join(''):'<tr><td colspan="4">No entries</td></tr>'}</tbody><tfoot><tr><th colspan="3">${title} Total</th><th>${sum(a)}</th></tr></tfoot></table></div>`};return `<h2>WEEKLY WORK REPORT</h2><p><strong>Employee:</strong> ${escapeHTML(name)}<br><strong>Week:</strong> ${nice(reportWeek)} – ${nice(addDays(reportWeek,6))}</p>${section('overtime','OVERTIME')}${section('emergency','EMERGENCY')}<h3>Weekly Total: ${sum(all)} hours</h3>`}function renderReport(){let a=weekEntries(),ot=a.filter(e=>e.type==='overtime'),em=a.filter(e=>e.type==='emergency');$('weekRange').textContent=`${nice(reportWeek)} – ${nice(addDays(reportWeek,6))}`;$('otTotal').textContent=sum(ot);$('emTotal').textContent=sum(em);$('allTotal').textContent=sum(a);$('reportDetails').innerHTML=reportMarkup();let status=sent[fmt(reportWeek)];$('reportStatus').textContent=status?'Status: SENT · '+new Date(status).toLocaleDateString():'Status: PENDING';$('markSent').textContent=status?'Mark as Pending':'Mark as Sent';$('recordCount').textContent=`${entries.length} saved entries`;}function render(){renderCalendar();renderDaily();renderReport()}function openEditor(e,type){$('entryForm').reset();$('entryId').value=e?.id||'';$('editorTitle').textContent=e?'Edit Entry':'Add Entry';$('type').value=e?.type||type||'overtime';$('date').value=e?.date||fmt(selected);$('apartment').value=e?.apartment||'';$('description').value=e?.description||'';$('hours').value=e?.hours||'';$('editor').showModal()}$('addOvertime').onclick=()=>openEditor(null,'overtime');$('addEmergency').onclick=()=>openEditor(null,'emergency');$('cancelEditor').onclick=()=>$('editor').close();$('entryForm').onsubmit=e=>{e.preventDefault();let id=$('entryId').value||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random());let data={id,type:$('type').value,date:$('date').value,apartment:$('apartment').value.trim(),description:$('description').value.trim(),hours:Number($('hours').value)};if(!valid(data)||!data.apartment||!data.description){alert('Please complete all fields. Hours must be greater than 0 and at most 24.');return}entries=entries.filter(e=>e.id!==id);entries.push(data);selected=parse(data.date);shown=new Date(selected.getFullYear(),selected.getMonth(),1);reportWeek=weekStart(selected);$('editor').close();save()};$('prevMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);renderCalendar()};$('todayBtn').onclick=()=>{selected=new Date();shown=new Date(selected.getFullYear(),selected.getMonth(),1);reportWeek=weekStart(selected);render()};$('prevWeek').onclick=()=>{reportWeek=addDays(reportWeek,-7);renderReport()};$('nextWeek').onclick=()=>{reportWeek=addDays(reportWeek,7);renderReport()};$('toggleReport').onclick=()=>{$('reportDetails').classList.toggle('hidden');$('toggleReport').textContent=$('reportDetails').classList.contains('hidden')?'View Full Report':'Hide Full Report'};$('printReport').onclick=()=>{renderReport();window.print()};$('saveName').onclick=()=>{localStorage.setItem(NAME,$('employee').value.trim());renderReport();alert('Name saved')};$('markSent').onclick=()=>{let k=fmt(reportWeek);if(sent[k])delete sent[k];else sent[k]=new Date().toISOString();save()};function reportText(){let a=weekEntries(),name=$('employee').value.trim()||'Not specified';let lines=[`WEEKLY WORK REPORT`,`Employee: ${name}`,`Week: ${nice(reportWeek)} - ${nice(addDays(reportWeek,6))}`];for(let type of ['overtime','emergency']){let sub=a.filter(e=>e.type===type);lines.push('',type.toUpperCase());for(let e of sub)lines.push(`${e.date} | Apt ${e.apartment} | ${e.description} | ${e.hours} hrs`);lines.push(`TOTAL ${type.toUpperCase()}: ${sum(sub)} hrs`)}lines.push('',`TOTAL HOURS: ${sum(a)}`);return lines.join('\n')}$('shareReport').onclick=async()=>{let content=reportText();if(navigator.share){try{await navigator.share({title:'Weekly Work Report',text:content})}catch(e){if(e.name!=='AbortError')alert('Could not share report')}}else{try{await navigator.clipboard.writeText(content);alert('Report copied. Paste it into your email or message.')}catch{alert('Use Save / Print PDF to share the report.')}}};function download(name,text){let blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('exportBackup').onclick=()=>download('work-hours-backup-'+fmt(new Date())+'.json',JSON.stringify({version:1,employee:$('employee').value,entries,sent},null,2));$('importBackup').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.version!==1||!Array.isArray(obj.entries)||!obj.entries.every(valid))throw Error('Invalid backup');if(!confirm('Restore backup? This will replace all current entries. Download a backup first if needed.'))return;entries=obj.entries;sent=obj.sent&&typeof obj.sent==='object'&&!Array.isArray(obj.sent)?obj.sent:{};$('employee').value=String(obj.employee||'').slice(0,150);localStorage.setItem(NAME,$('employee').value);save();alert('Backup restored')}catch(err){alert('Could not restore: '+err.message)}finally{e.target.value=''}};load();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
